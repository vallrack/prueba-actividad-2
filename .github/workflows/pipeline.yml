name: CI/CD Pipeline para GitHub Pages

on:
  push:
    branches:
      - main  # Se activa al subir cambios a la rama principal

permissions:
  contents: write  # Permiso crucial para que el Action cree la rama gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Instalación de Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalación de dependencias 🏗️
        run: npm install

      - name: Build del proyecto SvelteKit 🚀
        run: npm run build

      - name: Deploy a GitHub Pages 📂
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # SvelteKit con adapter-static genera la carpeta 'build'
          branch: gh-pages # Rama donde se publicará el sitio
          clean: true